apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-test
  template:
    metadata:
      labels:
        app: cicd-test
    spec:
      containers:
      - name: cicd-test
        image: cicd-test:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-test
  namespace: default
spec:
  type: NodePort
  selector:
    app: cicd-test
  ports:
  - port: 3000
    targetPort: 3000
